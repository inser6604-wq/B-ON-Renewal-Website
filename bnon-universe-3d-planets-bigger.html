<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>B&ON Universe — 3D SVG + Planets</title>
<style>
html,body{margin:0;background:#000}
body{min-height:100vh;display:grid;place-items:center}
.universe{width:min(420px,86vw);aspect-ratio:1}
svg{display:block;width:100%;height:100%}
.sphere,.ring{fill:none;stroke:#fff;vector-effect:non-scaling-stroke}
.sphere{stroke-width:1.3;opacity:.88}
.ring{stroke-width:1.15;opacity:.78}
.planet{fill:#fff}
</style>
</head>
<body>
<div class="universe">
<svg viewBox="-220 -220 440 440">
  <defs><clipPath id="sphereClip"><circle cx="0" cy="0" r="184"/></clipPath></defs>
  <circle class="sphere" cx="0" cy="0" r="184"/>
  <g clip-path="url(#sphereClip)">
    <path id="ringA" class="ring"/>
    <path id="ringB" class="ring"/>
    <circle id="planetA" class="planet" r="4"/>
    <circle id="planetB" class="planet" r="3"/>
  </g>
</svg>
</div>

<script>
(() => {
  const ringA = document.querySelector('#ringA');
  const ringB = document.querySelector('#ringB');
  const planetA = document.querySelector('#planetA');
  const planetB = document.querySelector('#planetB');

  const R = 180, N = 180;
  const deg = d => d * Math.PI / 180;

  function rotateX(p,a){
    const c=Math.cos(a),s=Math.sin(a);
    return [p[0],p[1]*c-p[2]*s,p[1]*s+p[2]*c];
  }
  function rotateY(p,a){
    const c=Math.cos(a),s=Math.sin(a);
    return [p[0]*c+p[2]*s,p[1],-p[0]*s+p[2]*c];
  }
  function rotateZ(p,a){
    const c=Math.cos(a),s=Math.sin(a);
    return [p[0]*c-p[1]*s,p[0]*s+p[1]*c,p[2]];
  }

  function project(p){
    const q = 760/(760-p[2]);
    return {x:p[0]*q, y:p[1]*q, z:p[2]};
  }

  function pointOnRing(theta,rx,ry,rz){
    let p=[R*Math.cos(theta),R*Math.sin(theta),0];
    p=rotateX(p,rx);
    p=rotateY(p,ry);
    p=rotateZ(p,rz);
    return project(p);
  }

  function makeRing(rx,ry,rz){
    let d='';
    for(let i=0;i<=N;i++){
      const p=pointOnRing(i/N*Math.PI*2,rx,ry,rz);
      d += `${i===0?'M':'L'}${p.x.toFixed(2)},${p.y.toFixed(2)} `;
    }
    return d+'Z';
  }

  const start=performance.now();

  function animate(now){
    const t=(now-start)/1000;
    const a=t*Math.PI*2/2.55;
    const b=-t*Math.PI*2/3.15;

    const arx=deg(67)+Math.sin(a*.52)*deg(11);
    const ary=a;
    const arz=deg(24);

    const brx=b;
    const bry=deg(61)+Math.sin(b*.47)*deg(9);
    const brz=deg(-28);

    ringA.setAttribute('d',makeRing(arx,ary,arz));
    ringB.setAttribute('d',makeRing(brx,bry,brz));

    /* 점도 같은 3D 원 위를 이동. circle r은 고정이라 찌그러지지 않음. */
    const pa=pointOnRing(a*1.18+0.35,arx,ary,arz);
    const pb=pointOnRing(-b*1.07+3.4,brx,bry,brz);

    planetA.setAttribute('cx',pa.x);
    planetA.setAttribute('cy',pa.y);
    planetB.setAttribute('cx',pb.x);
    planetB.setAttribute('cy',pb.y);

    /* 뒤쪽으로 갈 때 아주 살짝 흐려져 깊이감만 추가 */
    planetA.style.opacity = String(0.48 + ((pa.z/R)+1)*0.26);
    planetB.style.opacity = String(0.48 + ((pb.z/R)+1)*0.26);

    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
